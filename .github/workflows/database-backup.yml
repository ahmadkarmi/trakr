name: Automated Database Backup

on:
  schedule:
    # Daily at 3 AM UTC (6 AM UAE time)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  backup-database:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          
      - name: DNS debug (Supabase host)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DB_HOST_PORT="${SUPABASE_DB_URL#*@}"
          DB_HOST="${DB_HOST_PORT%%:*}"
          echo "Host: ${DB_HOST}"
          echo "getent hosts:" && getent hosts "${DB_HOST}" || true
          echo "getent ahostsv4:" && getent ahostsv4 "${DB_HOST}" || true
          echo "getent ahostsv6:" && getent ahostsv6 "${DB_HOST}" || true
          echo "ping -c 1 host:" && ping -c 1 "${DB_HOST}" || true
          
      - name: Create database backup
        env:
          # IDE may warn about secrets context, but this is correct GitHub Actions syntax
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Format: postgresql://postgres:[password]@[host]:5432/postgres
        run: |
          BACKUP_DATE=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="trakr-db-backup-${BACKUP_DATE}.sql"
          
          echo "Creating backup: ${BACKUP_FILE}"
          
          DB_HOST_PORT="${SUPABASE_DB_URL#*@}"
          DB_HOST="${DB_HOST_PORT%%:*}"
          DB_IPV4=$(getent hosts "${DB_HOST}" | awk '$1 ~ /^[0-9.]+$/ {print $1; exit}')

          if [ -n "${DB_IPV4}" ]; then
            SUPABASE_DB_URL_EFFECTIVE="${SUPABASE_DB_URL/@${DB_HOST}/@${DB_IPV4}}"
            echo "Resolved ${DB_HOST} → ${DB_IPV4}"
          else
            SUPABASE_DB_URL_EFFECTIVE="${SUPABASE_DB_URL}"
            echo "IPv4 lookup failed for ${DB_HOST}; falling back to original host"
          fi

          echo "Using connection string: ${SUPABASE_DB_URL_EFFECTIVE}" | sed 's/:[^:@]*@/:***@/'
          
          # Full database backup
          PGOPTIONS='--client-min-messages=warning' pg_dump "${SUPABASE_DB_URL_EFFECTIVE}" \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            > "${BACKUP_FILE}"
          
          # Compress backup
          gzip "${BACKUP_FILE}"
          
          echo "Backup created: ${BACKUP_FILE}.gz"
          ls -lh "${BACKUP_FILE}.gz"
          
      - name: Upload backup to GitHub Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: database-backup-${{ github.run_number }}
          path: trakr-db-backup-*.sql.gz
          retention-days: 90 # Keep for 3 months
            
  backup-schema-only:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          
      - name: DNS debug (Supabase host)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DB_HOST_PORT="${SUPABASE_DB_URL#*@}"
          DB_HOST="${DB_HOST_PORT%%:*}"
          echo "Host: ${DB_HOST}"
          echo "getent hosts:" && getent hosts "${DB_HOST}" || true
          echo "getent ahostsv4:" && getent ahostsv4 "${DB_HOST}" || true
          echo "getent ahostsv6:" && getent ahostsv6 "${DB_HOST}" || true
          echo "ping -c 1 host:" && ping -c 1 "${DB_HOST}" || true
          
      - name: Backup database schema
        env:
          # IDE may warn about secrets context, but this is correct GitHub Actions syntax
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          BACKUP_DATE=$(date +%Y%m%d_%H%M%S)
          SCHEMA_FILE="trakr-schema-${BACKUP_DATE}.sql"
          
          DB_HOST_PORT="${SUPABASE_DB_URL#*@}"
          DB_HOST="${DB_HOST_PORT%%:*}"
          DB_IPV4=$(getent hosts "${DB_HOST}" | awk '$1 ~ /^[0-9.]+$/ {print $1; exit}')

          if [ -n "${DB_IPV4}" ]; then
            SUPABASE_DB_URL_EFFECTIVE="${SUPABASE_DB_URL/@${DB_HOST}/@${DB_IPV4}}"
            echo "Resolved ${DB_HOST} → ${DB_IPV4}"
          else
            SUPABASE_DB_URL_EFFECTIVE="${SUPABASE_DB_URL}"
            echo "IPv4 lookup failed for ${DB_HOST}; falling back to original host"
          fi
          
          echo "Using connection string: ${SUPABASE_DB_URL_EFFECTIVE}" | sed 's/:[^:@]*@/:***@/'
          
          # Schema-only backup (no data)
          PGOPTIONS='--client-min-messages=warning' pg_dump "${SUPABASE_DB_URL_EFFECTIVE}" \
            --schema-only \
            --no-owner \
            --no-privileges \
            > "${SCHEMA_FILE}"
          
          echo "Schema backup created: ${SCHEMA_FILE}"
          
      - name: Commit schema to repository
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          mkdir -p database/backups/schemas
          cp trakr-schema-*.sql database/backups/schemas/latest-schema.sql
          
          git add database/backups/schemas/latest-schema.sql
          git commit -m "chore: automated schema backup $(date +%Y-%m-%d)" || echo "No schema changes"
          git push || echo "No changes to push"
