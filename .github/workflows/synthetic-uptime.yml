name: Synthetic Uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  uptime:
    runs-on: ubuntu-latest
    env:
      SYNTHETIC_LOGIN_URL: https://trakr-mobile.vercel.app/login
      SYNTHETIC_SUPABASE_URL: ${{ secrets.SYNTHETIC_SUPABASE_URL }}
      SYNTHETIC_SUPABASE_ANON_KEY: ${{ secrets.SYNTHETIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Run synthetic checks
        run: node scripts/check-uptime.mjs
