name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # TEMP: non-blocking until the pre-existing lint debt is burned down
      # (531 errors, mostly no-explicit-any — tracked as a follow-up)
      - name: Lint (advisory)
        run: npm run lint --workspace @trakr/web
        continue-on-error: true

      - name: Type check
        run: npm run type-check --workspace @trakr/shared && npm run type-check --workspace @trakr/web

      - name: Unit tests (web)
        run: npm run test:run --workspace @trakr/web

      # packages/shared holds the compliance-scoring logic and had no CI test
      # coverage before this step (the web unit step never reaches it). Gating.
      - name: Unit tests (shared)
        run: npm run test:run --workspace @trakr/shared

      # Invariant guard: audit evidence is section-level only. The deprecated
      # per-question/comment photo model (Audit.photos, AuditPhoto.questionId/
      # commentId) was removed and must not return.
      - name: Guard section-level evidence invariant
        run: |
          set -e
          f=packages/shared/src/types/audit.ts
          if grep -nE '\bphotos\?:[[:space:]]*AuditPhoto' "$f"; then
            echo "::error::Deprecated Audit.photos reintroduced — evidence is section-level only (use sectionPhotos)"; exit 1
          fi
          if awk '/interface AuditPhoto/{f=1} f{print} f&&/^}/{exit}' "$f" | grep -nE 'questionId|commentId'; then
            echo "::error::Deprecated questionId/commentId on AuditPhoto reintroduced — evidence is section-level only"; exit 1
          fi
          echo "OK: no deprecated per-question/comment photo fields"

      - name: Build
        run: npm run build --workspace @trakr/web
        env:
          VITE_BACKEND: supabase
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
